<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库</title>
<script src="marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Noto Sans SC',sans-serif;background:#f8f9fa;color:#333}
.header{background:#fff;border-bottom:1px solid #eef0f4;padding:0 20px;height:48px;display:flex;align-items:center;gap:4px}
.header a{padding:6px 14px;border-radius:6px;text-decoration:none;font-size:.82rem;color:#555;transition:.1s}
.header a:hover{background:#f0faf5;color:#42b983}
.header a.cur{background:#f0faf5;color:#42b983;font-weight:600}
.header .gap{flex:1}
.body{display:flex;height:calc(100vh - 48px)}
.sidebar{width:240px;background:#fff;border-right:1px solid #eee;overflow-y:auto;flex-shrink:0;padding:.5rem 0;font-size:.85rem}
.sidebar .sec{padding:.3rem 1rem;font-size:.75rem;font-weight:600;color:#999;text-transform:uppercase}
.sidebar .i{display:block;padding:.25rem 1rem .25rem 1.5rem;cursor:pointer;color:#555;text-decoration:none;border-left:3px solid transparent;font-size:.85rem}
.sidebar .i:hover{color:#42b983;background:#f0faf5}
.sidebar .i.active{color:#42b983;border-left-color:#42b983;background:#f0faf5;font-weight:600}
.sidebar .i.l2{padding-left:2rem;font-size:.8rem;color:#666}
.main{flex:1;padding:2rem;overflow-y:auto;max-width:860px}
.main h1{font-size:1.5rem;color:#2c3e50;margin-bottom:.3rem}
.main h2{font-size:1.1rem;margin:1rem 0 .3rem;color:#42b983}
.main p,.main li{font-size:.9rem;line-height:1.8;color:#444}
.main code{background:#f0f0f0;padding:.1rem .4rem;border-radius:3px;font-size:.8rem}
.main pre{background:#f8f9fa;padding:1rem;border-radius:8px;overflow-x:auto;margin:.5rem 0}
.main pre code{background:none;padding:0}
.main blockquote{border-left:4px solid #42b983;padding:.3rem 1rem;margin:.5rem 0;background:#f8f9fa;color:#666}
.main a{color:#42b983}
.main hr{border:none;border-top:1px solid #eee;margin:1rem 0}
.blk{background:#fff;border-radius:8px;padding:.8rem 1rem;margin-bottom:.5rem;border:1px solid #eaecef;cursor:pointer}
.blk .t{font-weight:600;color:#2c3e50}
.blk .d{font-size:.85rem;color:#666;margin-top:.2rem}
.empty{text-align:center;padding:3rem;color:#999;font-size:.9rem}
</style></head><body>
<div class="header">
  <a id="lk_dash">📊 看板</a>
  <a id="lk_arch">📐 架构</a>
  <a id="lk_guide">📖 指引</a>
  <span style="padding:6px 14px;border-radius:6px;font-size:.82rem;background:#f0faf5;color:#42b983;font-weight:600">📚 知识库</span>
  <span class="gap"></span>
  <span id="kb_port" style="font-size:.72rem;color:#bbb"></span>
</div>
<script>
// 自适应链接：本机访问用 localhost:5003，服务器访问用 106.53.70.121:5003
(function(){
  var local = location.hostname==='localhost'||location.hostname==='127.0.0.1';
  var base = local ? 'http://localhost:5003' : 'http://106.53.70.121:5003';
  document.getElementById('lk_dash').href = base + '/dashboard';
  document.getElementById('lk_arch').href = base + '/architecture.html';
  document.getElementById('lk_guide').href = base + '/guide.html';
  document.getElementById('kb_port').textContent = local ? 'localhost:5004' : '服务器共享';
})();
</script>
<div class="body">
<div class="sidebar" id="s"><div class="empty" style="padding:1rem">加载中...</div></div>
<div class="main" id="c"><div class="empty">选择左侧分类浏览</div></div>
</div>
<script>
fetch('/api/knowledge-data').then(function(r){ return r.json(); }).then(function(D){
  var html='<div class="sec">项目实战</div>';
  D.projects.forEach(function(p){
    var pid=p.project, name=p.name||pid;
    html+='<div class="i l1" onclick="sel(this);showMd(\''+pid+'\',\''+name+'\')">'+name+'</div>';
    html+='<div class="i l2" onclick="sel(this);showMd(\''+pid+'\',\''+name+'\')">项目概述</div>';
    html+='<div class="i l2" onclick="sel(this);showPit(\''+pid+'\')">踩坑记录</div>';
  });
  html+='<div class="sec" style="margin-top:.5rem">踩坑百科</div>';
  html+='<div class="i l1" onclick="sel(this);showPit(\'all\')">全部踩坑</div>';
  html+='<div class="sec" style="margin-top:.5rem">读书笔记</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_wuyantonglun\',\'物演通论\')">《物演通论》递弱代偿</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_being_time\',\'存在与时间\')">《存在与时间》海德格尔</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_hegel_small\',\'小逻辑\')">黑格尔《小逻辑》</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_geb\',\'集异璧\')">《集异璧》哥德尔/艾舍尔/巴赫</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_santi\',\'三体\')">《三体》三部曲</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_shituoguo\',\'狮驼国\')">《西游记之狮驼国》白话解读</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'bk_shituoguo_ch9\',\'证法解读\')">第九章「师徒证法」解读</div>';
  html+='<div class="sec" style="margin-top:.5rem">答疑解惑</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'qa_cpp_pointer\',\'C++指针\')">C++ 指针 vs Java 引用</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'qa_lang_perf\',\'语言性能\')">高级语言性能与内存控制</div>';
  html+='<div class="sec" style="margin-top:.5rem">经验总结</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'exp_claude\',\'Claude架构\')">Claude Code 运行逻辑</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'exp_claude_arch\',\'Claude运行架构\')">Claude Code 运行架构</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'exp_memory_sync\',\'经验同步\')">经验与知识库同步机制</div>';
  html+='<div class="sec" style="margin-top:.5rem">技术栈集</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_git\',\'Git\')">Git</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_flask\',\'Flask\')">Flask / Python</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_sqlite\',\'SQLite\')">SQLite</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_nginx\',\'Nginx\')">Nginx + Linux</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_spring\',\'Spring Boot\')">Spring Boot + MyBatis</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_mysql\',\'MySQL\')">MySQL</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'ts_vue\',\'Vue\')">Vue 3 / uni-app</div>';
  html+='<div class="sec" style="margin-top:.5rem">运维必备</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_tencent\',\'腾讯云\')">腾讯云</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_ssh\',\'SSH\')">SSH & 远程</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_service\',\'服务管理\')">服务管理</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_log\',\'日志排查\')">日志排查</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_cron\',\'定时任务\')">定时任务</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_ssl\',\'SSL\')">SSL 证书</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_db\',\'数据库\')">数据库查看</div>';
  html+='<div class="i l2" onclick="sel(this);showMd(\'op_start\',\'服务启动\')">服务启动命令</div>';
  html+='<div class="sec" style="margin-top:.5rem">外站</div>';
  html+='<a href="https://r2coding.com" target="_blank" class="i l1" style="display:block;color:#42b983">🌐 r2coding 参考</a>';
  document.getElementById('s').innerHTML=html;
  window._K = D.knowledge;
  window._E = D.experiences;
});
function sel(el){document.querySelectorAll('.sidebar .i').forEach(function(x){x.classList.remove('active')});el.classList.add('active');}
function showMd(pid,name){
  var main=document.getElementById('c');
  var k=(window._K||[]).find(function(x){ return x.node_id==='pa_'+pid||x.node_id==='pt_'+pid||x.node_id===pid; });
  if(k){ main.innerHTML=marked.parse(k.content); return; }
  main.innerHTML='<div class="empty">待补充：还没有写内容</div>';
}
function showPit(pid){
  var main=document.getElementById('c');
  var items=pid==='all'?window._E:(window._E||[]).filter(function(e){return e.project&&e.project.indexOf(pid)>=0;});
  if(!items||!items.length){main.innerHTML='<div class="empty">暂无踩坑记录</div>';return;}
  main.innerHTML='<h1>踩坑记录 ('+items.length+')</h1>'+items.map(function(e,i){
    return '<div class="blk" onclick="var d=document.getElementById(\'e_'+i+'\');d.style.display=d.style.display==\'none\'?\'block\':\'none\'"><div class=t>'+e.problem+' <span style="font-size:.75rem;color:#999;float:right">'+e.date+'</span></div><div class=d style="color:#888">'+e.root_cause.slice(0,60)+'... <span style="color:#42b983">展开</span></div><div id="e_'+i+'" style="display:none;margin-top:.3rem;padding-top:.3rem;border-top:1px solid #eee;font-size:.85rem;line-height:1.6"><b>根因：</b>'+e.root_cause+'<br><b>解决：</b>'+e.solution+(e.tech_stack?'<br><b>技术：</b>'+e.tech_stack:'')+'</div></div>';
  }).join('');
}
</script></body></html>
